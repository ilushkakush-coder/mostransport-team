<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f2" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Вакансия мечты — Нрав или не нрав?</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171717;
      --muted: #707070;
      --gray: #5d5d5d;
      --line: #dedede;
      --surface: #fff;
      --bg: #f2f2f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      padding: calc(16px + max(78px, var(--tg-content-safe-area-inset-top, 0px))) 16px 32px;
      display: grid; place-items: center; color: var(--ink);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 50% -20%, #fff 0, var(--bg) 68%);
    }
    .app { width: min(100%, 420px); }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.035em; }
    .logo { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 13px; color: #f04452; background: #111; font-size: 22px; line-height: 1; }
    .counter { color: var(--muted); font-size: 13px; font-weight: 700; }
    .heading { margin: 0 0 4px; font-size: 29px; letter-spacing: -.05em; }
    .subheading { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    .deck { position: relative; height: min(58vh, 490px); min-height: 390px; }
    .card {
      position: absolute; inset: 0; padding: 24px; overflow: hidden; border: 1px solid var(--line); border-radius: 28px;
      background: var(--surface); box-shadow: 0 18px 55px #00000012;
      touch-action: pan-y; user-select: none; cursor: grab;
      transition: transform .18s cubic-bezier(.2,.75,.25,1), opacity .18s ease-out;
    }
    .card.dragging { transition: none; cursor: grabbing; }
    .card.under { transform: scale(.96) translateY(12px); opacity: .68; }
    .card.gone-right { transform: translate(125%, -6%) rotate(18deg); opacity: 0; }
    .card.gone-left { transform: translate(-125%, -6%) rotate(-18deg); opacity: 0; }
    .swipe-label { position: absolute; z-index: 2; top: 24px; padding: 7px 11px; border: 3px solid; border-radius: 10px; font-size: 14px; font-weight: 900; letter-spacing: .06em; opacity: 0; background: #ffffffd9; }
    .label-yes { right: 18px; color: #222; border-color: #222; transform: rotate(9deg); }
    .label-no { left: 18px; color: #555; border-color: #777; transform: rotate(-9deg); }
    .card-content { height: 100%; display: flex; flex-direction: column; }
    .card-index { align-self: flex-start; margin: 1px 0 26px; padding: 6px 10px; border-radius: 999px; color: #555; background: #f0f0f0; font-size: 12px; font-weight: 700; }
    .question { margin: auto 0; font-size: clamp(28px, 8vw, 36px); line-height: 1.13; letter-spacing: -.05em; font-weight: 820; }
    .question.compact { font-size: clamp(25px, 7vw, 32px); }
    .actions { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 19px 0 13px; }
    .action { display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 142px; height: 58px; padding: 0 18px; border: 0; border-radius: 999px; box-shadow: 0 8px 22px #0000001a; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; font: inherit; font-weight: 800; }
    .action:hover { transform: translateY(-2px); box-shadow: 0 11px 28px #00000027; }
    .action:active { transform: scale(.97); }
    .action.no { color: #fff; background: var(--gray); }
    .action.yes { color: #fff; background: var(--ink); }
    .action svg { width: 21px; height: 21px; flex: 0 0 auto; }
    .hint { text-align: center; color: #777; font-size: 12px; }
    .empty { display: grid; place-content: center; height: 100%; text-align: center; }
    .empty .emoji { font-size: 48px; }
    .empty h2 { margin: 12px 0 5px; }
    .empty { display: grid; place-content: center; justify-items: center; gap: 12px; height: 100%; text-align: center; }
    .empty h2 { margin: 0; font-size: clamp(38px, 10vw, 52px); line-height: 1.05; letter-spacing: -.05em; }
    .empty p { max-width: 310px; margin: 0; color: var(--muted); font-size: 15px; }
    .apply-link { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; margin-top: 6px; padding: 0 26px; border-radius: 999px; color: #fff; background: var(--ink); font-weight: 800; text-decoration: none; }
    .toast { position: fixed; z-index: 5; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translate(-50%, 14px); opacity: 0; width: min(92vw, 480px); padding: 12px 18px; border-radius: 16px; color: #fff; background: #333; box-shadow: 0 8px 24px #00000030; font-size: 14px; font-weight: 700; pointer-events: none; transition: .22s; text-align: center; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    @media (max-height: 760px) { body { padding-top: calc(12px + max(70px, var(--tg-content-safe-area-inset-top, 0px))); } .heading { font-size: 26px; } .deck { height: 54vh; min-height: 340px; } .card { padding: 20px; } .card-index { margin-bottom: 18px; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><span class="logo" aria-hidden="true">♥</span><span>Вакансия мечты</span></div>
      <span class="counter" id="counter"></span>
    </header>
    <h1 class="heading">Нрав или не нрав?</h1>
    <p class="subheading">Свайп вправо — нрав, влево — не нрав</p>
    <section class="deck" id="deck" aria-label="Карточки с вопросами"></section>
    <div class="actions" id="actions">
      <button class="action no" id="skip" aria-label="Не нрав — пропустить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m7 7 10 10M17 7 7 17"/></svg>
        Не нрав
      </button>
      <button class="action yes" id="like" aria-label="Нрав — выбрать">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>
        Нрав
      </button>
    </div>
    <div class="hint" id="hint">Можно также использовать кнопки или стрелки клавиатуры</div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    // Apps Script URL используется Vercel API proxy, чтобы получать реальный ответ о записи.
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwRe5CmVRT-AsHEB-d2IFlAOz8arWwBxQCrg8JQGlE79Af0_81D8OdqdAXYTSXX6tOD/exec';
    const questions = [
      { id: 'V2-01', text: 'Получать 600 рублей каждый день на завтраки и обеды' },
      { id: 'V2-02', text: 'Быстро расти по карьере, даже если это временно мешает личной жизни' },
      { id: 'V2-03', text: 'Присоединиться к корпоративным творческим комьюнити: петь в хоре, служить в театре' },
      { id: 'V2-04', text: 'Работать по ночам' },
      { id: 'V2-05', text: 'Понимать задачи и условия для повышения — то есть строить прозрачный карьерный трек' },
      { id: 'V2-06', text: 'Бесплатно ездить на общественном транспорте' },
      { id: 'V2-07', text: 'Участвовать в профессиональных конкурсах среди коллег из компании и со всей страны' },
      { id: 'V2-08', text: 'Работать по фиксированному графику без переработок' },
      { id: 'V2-09', text: 'Получать юридическую и финансовую помощь, путевки и подарки от профсоюза' },
      { id: 'V2-10', text: 'Сменить специальность внутри компании без карьерных потерь' },
      { id: 'V2-11', text: 'Работать у дома' },
      { id: 'V2-12', text: 'Возможность стать амбассадором компании: представлять бренд работодателя на событиях и в соцсетях' },
      { id: 'V2-13', text: 'Работать сменами 1/1, 2/2 или 3/3 по 12–24 часа' },
      { id: 'V2-14', text: 'Устроиться на работу, где не нужно образование и опыт' },
      { id: 'V2-15', text: 'Заниматься спортом и участвовать в соревнованиях за счет работодателя' },
      { id: 'V2-16', text: 'Собираться на планерках и писать начальнику напрямую по рабочим и нерабочим вопросам' },
      { id: 'V2-17', text: 'Работать в стабильной компании много лет, иногда выполняя скучные задачи' },
      { id: 'V2-18', text: 'Отдыхать в официальном отпуске до 48 дней в год' },
      { id: 'V2-19', text: 'Работать в тоннеле метро' },
      { id: 'V2-20', text: 'Принимать решение об устройстве в компанию по отзывам в интернете' },
      { id: 'V2-21', text: 'Работать на физически тяжелой грязной должности с высокой зарплатой и быстрым карьерным ростом' },
      { id: 'V2-22', text: 'Присоединиться к корпоративному комьюнити молодых сотрудников до 35 лет' },
      { id: 'V2-23', text: 'Стабильно зарабатывать каждый год на 1–5% больше за счет индексации' },
      { id: 'V2-24', text: 'Подчиняться руководителю, который поднялся с рабочей специальности' },
      { id: 'V2-25', text: 'Получить рабочую специальность за счет компании' },
      { id: 'V2-26', text: 'Совмещать работу и учебу/хобби/бизнес' },
      { id: 'V2-27', text: 'Понимать ценность своей работы и чувствовать командность' },
      { id: 'V2-28', text: 'Работать по трудовому договору' },
      { id: 'V2-29', text: 'Получать бонусы типа мерча, билетов, путевок за участие во внерабочих корпоративных событиях' },
      { id: 'V2-30', text: 'Выйти на пенсию после 20–25 лет стажа' }
    ];
    const deck = document.querySelector('#deck');
    const counter = document.querySelector('#counter');
    const toast = document.querySelector('#toast');
    const telegram = window.Telegram && window.Telegram.WebApp;
    const initData = telegram ? telegram.initData : '';
    const sessionId = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    let current = 0;
    let toastTimer;
    let isSaving = false;
    const saveQueue = [];
    let saveQueueRunning = false;

    if (telegram) {
      telegram.ready();
      telegram.expand();
      // Отключаем вертикальный свайп Telegram, который сворачивает Mini App.
      if (typeof telegram.disableVerticalSwipes === 'function') telegram.disableVerticalSwipes();
      // Если закрытие всё же инициировано кнопкой или системным жестом, просим подтверждение.
      if (typeof telegram.enableClosingConfirmation === 'function') telegram.enableClosingConfirmation();
    }

    function endpointConfigured() {
      return APPS_SCRIPT_URL.startsWith('https://script.google.com/macros/s/') &&
        !APPS_SCRIPT_URL.includes('PASTE_DEPLOYED');
    }

    async function sendEvent(payload) {
      if (!endpointConfigured()) return { ok: false, error: 'Apps Script не подключён' };
      if (!initData) return { ok: false, error: 'Открой мини-приложение через Telegram' };
      try {
        const response = await fetch('/api/swipe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...payload, initData, sessionId })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.ok) {
          return { ok: false, error: result.error || `Ошибка сервера (${response.status})` };
        }
        return { ok: true };
      } catch (error) {
        console.error('Не удалось отправить событие в Apps Script', error);
        return { ok: false, error: 'Нет связи с сервером. Попробуй ещё раз.' };
      }
    }

    if (endpointConfigured() && initData) enqueueSave({ event: 'open' });

    function render() {
      counter.textContent = current < questions.length ? `${current + 1} из ${questions.length}` : '';
      if (current >= questions.length) {
        deck.innerHTML = '<div class="empty"><h2>У нас мэтч 🫦</h2><p>Не мечтай, устраивайся в команду транспорта</p><a class="apply-link" href="https://rabota.transport.mos.ru/" target="_blank" rel="noopener noreferrer">Устроиться</a></div>';
        document.querySelector('#actions').hidden = true;
        document.querySelector('#hint').hidden = true;
        return;
      }
      document.querySelector('#actions').hidden = false;
      document.querySelector('#hint').hidden = false;
      deck.innerHTML = '';
      if (current + 1 < questions.length) {
        const back = document.createElement('article');
        back.className = 'card under';
        back.setAttribute('aria-hidden', 'true');
        deck.append(back);
      }
      const item = questions[current];
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `<span class="swipe-label label-yes">НРАВ</span><span class="swipe-label label-no">НЕ НРАВ</span>
        <div class="card-content"><div class="card-index">ВОПРОС ${current + 1}</div>
          <h2 class="question">${item.text}</h2></div>`;
      deck.append(card);
      enableSwipe(card);
    }

    async function decide(normal) {
      if (current >= questions.length || isSaving) return;
      const questionIndex = current;
      const card = deck.querySelector('.card:not(.under)');
      if (!card) return;
      const payload = {
        event: 'swipe',
        questionId: questions[questionIndex].id,
        answer: normal ? 'нрав' : 'не нрав'
      };
      if (!endpointConfigured()) {
        showToast(normal ? 'Нрав ❤️ · Apps Script ещё не подключён' : 'Не нрав 👎 · Apps Script ещё не подключён');
        return;
      } else if (!initData) {
        showToast('Открой мини-приложение через Telegram');
        return;
      }
      isSaving = true;
      document.querySelectorAll('.action').forEach(button => { button.disabled = true; });
      card.classList.add(normal ? 'gone-right' : 'gone-left');
      enqueueSave(payload, normal ? 'Нрав ❤️ · ответ сохранён' : 'Не нрав · ответ сохранён');
      // Показываем следующую карточку после анимации, не дожидаясь сети или Apps Script.
      await new Promise(resolve => setTimeout(resolve, 180));
      current++;
      render();
      isSaving = false;
      document.querySelectorAll('.action').forEach(button => { button.disabled = false; });
    }

    function enqueueSave(payload, successMessage = '') {
      saveQueue.push({ payload, successMessage });
      processSaveQueue();
    }

    async function processSaveQueue() {
      if (saveQueueRunning) return;
      saveQueueRunning = true;
      while (saveQueue.length) {
        const { payload, successMessage } = saveQueue.shift();
        if (successMessage) showToast('Сохраняю ответ…');
        const result = await sendEvent(payload);
        if (successMessage) {
          showToast(result.ok ? successMessage : `Не сохранилось: ${result.error}`);
        }
      }
      saveQueueRunning = false;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 6000);
    }

    function enableSwipe(card) {
      let startX = 0, startY = 0, dx = 0, active = false;
      const yes = card.querySelector('.label-yes');
      const no = card.querySelector('.label-no');
      card.addEventListener('pointerdown', event => {
        active = true; startX = event.clientX; startY = event.clientY; dx = 0;
        card.classList.add('dragging'); card.setPointerCapture(event.pointerId);
      });
      card.addEventListener('pointermove', event => {
        if (!active) return;
        dx = event.clientX - startX;
        const dy = event.clientY - startY;
        card.style.transform = `translate(${dx}px, ${dy * .18}px) rotate(${dx * .055}deg)`;
        const strength = Math.min(Math.abs(dx) / 90, 1);
        (dx >= 0 ? yes : no).style.opacity = strength;
        (dx >= 0 ? no : yes).style.opacity = 0;
      });
      const finish = () => {
        if (!active) return;
        active = false; card.classList.remove('dragging');
        if (Math.abs(dx) > 90) decide(dx > 0);
        else { card.style.transform = ''; yes.style.opacity = 0; no.style.opacity = 0; }
      };
      card.addEventListener('pointerup', finish);
      card.addEventListener('pointercancel', finish);
    }

    document.querySelector('#skip').addEventListener('click', () => decide(false));
    document.querySelector('#like').addEventListener('click', () => decide(true));
    window.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') decide(false);
      if (event.key === 'ArrowRight') decide(true);
    });
    render();
  </script>
</body>
</html>
